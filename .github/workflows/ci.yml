name: DriveChronik CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint und Build
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Corepack aktivieren
        run: corepack enable

      - name: Abhängigkeiten installieren
        run: corepack pnpm install --frozen-lockfile

      - name: Core-Paket bauen
        run: corepack pnpm --filter @drivechronik/core build

      - name: Datenbank-Paket bauen
        run: corepack pnpm --filter @drivechronik/db build

      - name: Worker prüfen
        run: corepack pnpm --filter @drivechronik/worker lint

      - name: Worker testen
        run: corepack pnpm --filter @drivechronik/worker test

      - name: Worker bauen
        run: corepack pnpm --filter @drivechronik/worker build

      - name: Web-App prüfen
        run: corepack pnpm --filter @drivechronik/web lint

      - name: Web-App bauen
        run: corepack pnpm --filter @drivechronik/web build
