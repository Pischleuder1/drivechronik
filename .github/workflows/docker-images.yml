name: DriveChronik Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Multi-Arch Images bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten für Web-Image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pischleuder1/drivechronik-web
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Web-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Metadaten für Worker-Image
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pischleuder1/drivechronik-worker
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Worker-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

      - name: Metadaten für Supercharge-Compass
        id: meta-supercharge
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pischleuder1/drivechronik-supercharge-compass
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Supercharge-Compass bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./services/supercharge-compass
          file: ./services/supercharge-compass/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-supercharge.outputs.tags }}
          labels: ${{ steps.meta-supercharge.outputs.labels }}
