<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#fafafa">
  <title>DriveChronik – Offline</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #fafafa;
      color: #171717;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        24px
        calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
    }

    img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    p {
      margin: 12px 0 0;
      color: #737373;
      line-height: 1.5;
    }

    button {
      margin-top: 24px;
      appearance: none;
      border: 1px solid #d4d4d4;
      background: white;
      color: #171717;
      border-radius: 12px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      p {
        color: #a3a3a3;
      }

      button {
        background: #171717;
        color: #f5f5f5;
        border-color: #404040;
      }
    }
  </style>
</head>

<body>
  <main>
    <img src="/brand/drivechronik-logo.png" alt="">
    <h1>DriveChronik ist offline</h1>

    <p>
      Der DriveChronik-Server ist momentan nicht erreichbar.
      Sobald wieder eine Verbindung besteht, kannst du wie gewohnt
      auf deine Fahrten und Auswertungen zugreifen.
    </p>

    <button type="button" onclick="location.reload()">
      Erneut versuchen
    </button>
  </main>
</body>
</html>
