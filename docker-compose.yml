# DriveChronik — production deployment (Docker Compose).
#
# Runs the DriveChronik app stack (db, one-shot migration, web, sync worker)
# against an EXISTING TeslaMate installation's Postgres, reached read-only.
# See README.md "Deployment" for the full runbook.
#
# TeslaMate connectivity:
# Standard: TeslaMate-Postgres ist per LAN/VPN/Hostname erreichbar.
# Dafür reicht TESLAMATE_DATABASE_URL in .env; kein zusätzliches Docker-Netz nötig.
#
# Läuft TeslaMate auf demselben Docker-Host, kann optional
# docker-compose.teslamate.yml nach docker-compose.override.yml kopiert werden.
# Siehe README "Optional: TeslaMate auf demselben Docker-Host".

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivechronik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: drivechronik
    volumes:
      - drivechronik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivechronik"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No published port — only reachable from other services on this network.

  migrate:
    image: ghcr.io/pischleuder1/drivechronik-worker:${DRIVECHRONIK_IMAGE_TAG:-latest}
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://drivechronik:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/drivechronik
    depends_on:
      db:
        condition: service_healthy

  import-staging-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "chown -R 1001:1001 /import-staging"]
    volumes:
      - import-staging:/import-staging

  supercharge-compass:
    image: ghcr.io/pischleuder1/drivechronik-supercharge-compass:${DRIVECHRONIK_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_FILE: /app/data/superchargers.json
    volumes:
      - supercharge-compass-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/meta').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Internal service only — no published port required.

  web:
    image: ghcr.io/pischleuder1/drivechronik-web:${DRIVECHRONIK_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://drivechronik:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/drivechronik
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Optional, nur für die Verbindungs-Diagnose in Settings (read-only
      # Testquery). Im Normalbetrieb liest ausschließlich der Worker die
      # TeslaMate-DB — dieser Wert kann leer bleiben.
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:-}
      BACKUP_STATUS_FILE: /backup-status/backup-status.json
      IMPORT_STAGING_DIR: /import-staging
      MONTH_SEAL_PRIVATE_KEY_FILE: /run/secrets/month-seal-ed25519-private.pem
      SUPERCHARGE_COMPASS_URL: http://supercharge-compass:3000
    volumes:
      - ./secrets/month-seal-ed25519-private.pem:/run/secrets/month-seal-ed25519-private.pem:ro
      - ${BACKUP_DIR:-./backups}/status:/backup-status:ro
      - import-staging:/import-staging
    depends_on:
      import-staging-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      supercharge-compass:
        condition: service_healthy
  worker:
    image: ghcr.io/pischleuder1/drivechronik-worker:${DRIVECHRONIK_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://drivechronik:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/drivechronik
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:?Set TESLAMATE_DATABASE_URL in .env}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      IMPORT_STAGING_DIR: /import-staging
    volumes:
      - import-staging:/import-staging
    depends_on:
      import-staging-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No published port — sync loop only, no inbound traffic.

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: drivechronik
      DB_NAME: drivechronik
      BACKUP_STATUS_DIR: /backups/status
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./deploy/backup:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/bin/sh", "/scripts/backup.sh", "daemon"]

volumes:
  drivechronik-db-data:
  import-staging:
  supercharge-compass-data:
