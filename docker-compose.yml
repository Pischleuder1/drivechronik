# DriveChronik — production deployment (Docker Compose).
#
# Runs the tripatlas app stack (db, one-shot migration, web, sync worker)
# against an EXISTING TeslaMate installation's Postgres, reached read-only.
# See README.md "Deployment" for the full runbook.
#
# TeslaMate connectivity — two options for TESLAMATE_DATABASE_URL in .env:
#   (a) Same Docker host, TeslaMate on a shared Docker network:
#       set TESLAMATE_DATABASE_URL=postgres://tripatlas_ro:...@teslamate-db:5432/teslamate
#       and uncomment the `networks:` stanzas below (external teslamate_default).
#   (b) TeslaMate reachable over LAN/VPN (e.g. Tailscale) as a plain host:
#       set TESLAMATE_DATABASE_URL=postgres://tripatlas_ro:...@teslamate-host.example:5432/teslamate
#       — no extra network config needed, this is the default assumption below.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tripatlas
    volumes:
      - tripatlas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripatlas"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No published port — only reachable from other services on this network.

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: tripatlas-worker:latest
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://tripatlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tripatlas
    depends_on:
      db:
        condition: service_healthy

  import-staging-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "chown -R 1001:1001 /import-staging"]
    volumes:
      - import-staging:/import-staging

  supercharge-compass:
    build:
      context: ./services/supercharge-compass
      dockerfile: Dockerfile
    image: drivechronik-supercharge-compass:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_FILE: /app/data/superchargers.json
    volumes:
      - supercharge-compass-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/meta').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Internal service only — no published port required.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: tripatlas-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://tripatlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tripatlas
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Optional, nur für die Verbindungs-Diagnose in Settings (read-only
      # Testquery). Im Normalbetrieb liest ausschließlich der Worker die
      # TeslaMate-DB — dieser Wert kann leer bleiben.
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:-}
      BACKUP_STATUS_FILE: /backup-status/backup-status.json
      IMPORT_STAGING_DIR: /import-staging
      SUPERCHARGE_COMPASS_URL: http://supercharge-compass:3000
    volumes:
      - ${BACKUP_DIR:-./backups}/status:/backup-status:ro
      - import-staging:/import-staging
    depends_on:
      import-staging-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      supercharge-compass:
        condition: service_healthy
    networks:
      - default
      - teslamate

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: tripatlas-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tripatlas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tripatlas
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:?Set TESLAMATE_DATABASE_URL in .env}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      IMPORT_STAGING_DIR: /import-staging
    volumes:
      - import-staging:/import-staging
    depends_on:
      import-staging-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No published port — sync loop only, no inbound traffic.
    networks:
      - default
      - teslamate

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: tripatlas
      DB_NAME: tripatlas
      BACKUP_STATUS_DIR: /backups/status
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./deploy/backup:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/bin/sh", "/scripts/backup.sh", "daemon"]

volumes:
  tripatlas-db-data:
  import-staging:
  supercharge-compass-data:

networks:
  teslamate:
    name: teslamate_default
    external: true

# Uncomment if TeslaMate runs on this same Docker host and you want to reach
# it via its Compose network instead of a LAN/Tailscale host address:
#
# networks:
#   default:
#     name: tripatlas_default
#   teslamate:
#     name: teslamate_default
#     external: true
#
# ...and add `networks: [default, teslamate]` to the `worker` service so it
# can resolve the TeslaMate db service by its Compose service name.
